<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matrix ERP · 授权店铺</title><style>body{margin:0;background:#f4f7f6;color:#17382f;font:14px Arial,'Microsoft YaHei',sans-serif}.top{height:58px;background:#06aaa9;color:#fff;display:flex;align-items:center;padding:0 28px;font-size:20px;font-weight:700}.wrap{max-width:1420px;margin:0 auto;padding:24px}.crumb{color:#60766c;margin-bottom:18px}.tabs,.platforms{display:flex;gap:8px;flex-wrap:wrap}.tab,.platform{padding:12px 22px;background:#fff;border:1px solid #d9e5df;border-radius:4px;cursor:pointer}.platform.active,.tab:hover{background:#e4f7f3;border-color:#08a493;color:#087b60}.toolbar{display:flex;gap:10px;margin:18px 0;align-items:center}.primary{background:#ff8b43;color:#fff;border:0;border-radius:4px;padding:11px 20px}.card{background:#fff;border:1px solid #dfe9e4;border-radius:9px;padding:22px;margin-top:16px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.field{display:grid;gap:7px;margin:14px 0}.field input,.field select{padding:11px;border:1px solid #ccdcd5;border-radius:4px;font-size:14px}.help{background:#fff8ee;color:#9b6b2b;padding:12px;border-radius:4px;margin-top:12px}.muted{color:#71877c;font-size:12px}@media(max-width:900px){.grid{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid{grid-template-columns:1fr}.wrap{padding:14px}}</style></head><body><div class="top">妙手式授权中心 · Matrix ERP</div><main class="wrap"><div class="crumb">工作台 / 授权管理 / 授权店铺</div><div class="card"><h1>授权店铺</h1><p class="muted">选择平台并填写店铺授权信息。真实密钥应提交到你的私有服务器保存。</p><div class="tabs"><button class="tab">全部平台</button><button class="tab">已授权（0）</button><button class="tab">未授权（4）</button></div><div class="platforms"><button class="platform active">Ozon</button><button class="platform">WB Partners</button><button class="platform">Temu 半托管</button><button class="platform">Shopee</button></div><div class="toolbar"><button class="primary">＋ 添加授权店铺</button><span class="muted">当前支持 Ozon、WB、Temu 半托管；Shopee 连接器准备中</span></div></div><div class="card"><h2>添加授权店铺</h2><div class="grid"><label class="field">平台<select><option>Ozon</option><option>WB Partners</option><option>Temu 半托管</option><option>Shopee</option></select></label><label class="field">店铺名称<input placeholder="例如：Ozon 童装 RU"></label><label class="field">店铺 ID<input placeholder="平台店铺 ID"></label><label class="field">站点<select><option>RU</option><option>GLOBAL</option><option>MY</option><option>TH</option></select></label></div><div class="grid"><label class="field">Client-Id<input placeholder="Ozon Seller Client-Id"></label><label class="field">Api-Key<input type="password" placeholder="Ozon Seller Api-Key"></label><label class="field">负责人<input placeholder="店铺负责人"></label><label class="field">默认发货仓<input value="佛山主仓"></label></div><div class="help">演示页面只展示字段，不会提交或保存真实密钥。部署私有后端后，这些字段会通过加密接口保存，并用于同步商品、订单和库存。</div></div></main></body></html>
